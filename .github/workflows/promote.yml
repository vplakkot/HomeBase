name: Promote to production

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the tagged commit with all tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Check the version tag is allowed
        run: |
          # Runs before any Vercel step, so a refused tag leaves production
          # exactly as it was.
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"

          pkg=$(jq -r .version package.json)
          if [ "$pkg" != "$version" ]; then
            echo "::error::Tag $tag says $version but package.json at the" \
              "tagged commit says $pkg. Bump package.json in the release" \
              "pull request, merge it, then tag. Production is unchanged." >&2
            exit 1
          fi

          # Every other vX.Y.Z tag, so the tag being promoted is not
          # compared with itself.
          others=$(git tag --list 'v[0-9]*' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | grep -vxF "$tag" || true)
          highest=$(printf '%s\n' "$others" | sort -V | tail -n 1)
          if [ -n "$highest" ] \
            && [ "$(printf '%s\n%s\n' "$highest" "$tag" | sort -V | tail -n 1)" != "$tag" ]; then
            echo "::error::Tag $tag is not higher than the existing tag" \
              "$highest. Releases only go forward. Production is" \
              "unchanged." >&2
            exit 1
          fi

          # A patch release fixes the minor release already live, so that
          # minor release (vX.Y.0) must exist first.
          patch="${version##*.}"
          minor_tag="v${version%.*}.0"
          if [ "$patch" -gt 0 ] && ! printf '%s\n' "$others" | grep -qxF "$minor_tag"; then
            echo "::error::Tag $tag is a patch release but $minor_tag has" \
              "not shipped yet. Release $minor_tag first. Production is" \
              "unchanged." >&2
            exit 1
          fi

          echo "Tag $tag matches package.json and is allowed."

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Check Vercel authentication
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          if ! vercel whoami --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"; then
            echo "::error::VERCEL_TOKEN could not authenticate as a user." \
              "This usually means the token is scoped too narrowly (e.g. to" \
              "a single project) rather than to the full account. Regenerate" \
              "it at vercel.com/account/tokens without a project restriction" \
              "and update the VERCEL_TOKEN secret." >&2
            exit 1
          fi

      - name: Wait for the tagged commit's build to be ready
        id: find
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          # A tag pushed right after its merge can arrive while Vercel is
          # still building that commit, and promoting an unfinished build
          # fails with a 422. Poll until the build is READY (up to 10
          # minutes), and stop early if it errored or was cancelled.
          deadline=$((SECONDS + 600))
          while true; do
            # A failed request or a non-JSON answer (say, a 502 page) is
            # treated as "nothing listed yet" and retried, not fatal.
            response=$(curl -s --max-time 30 \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?projectId=${VERCEL_PROJECT_ID}&target=production&limit=100" \
              || true)
            if ! echo "$response" | jq -e . > /dev/null 2>&1; then
              echo "::warning::No usable answer from Vercel. Retrying."
              response='{}'
            fi

            api_error=$(echo "$response" | jq -r '.error.message? // empty')
            if [ -n "$api_error" ]; then
              echo "::warning::Vercel API said: $api_error. Retrying."
            fi

            builds=$(echo "$response" | jq -c --arg sha "$GITHUB_SHA" \
              '[.deployments[]? | select(.meta.githubCommitSha == $sha)]')

            url=$(echo "$builds" | jq -r \
              '[.[] | select((.readyState // .state) == "READY")][0].url // empty')
            if [ -n "$url" ]; then
              echo "Found ready deployment for $GITHUB_SHA: $url"
              echo "url=$url" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            state=$(echo "$builds" | jq -r '.[0] | (.readyState // .state) // empty')
            unfinished=$(echo "$builds" | jq \
              '[.[] | select((.readyState // .state) | IN("ERROR", "CANCELED") | not)] | length')
            if [ -n "$state" ] && [ "$unfinished" -eq 0 ]; then
              echo "::error::Vercel's build of $GITHUB_SHA (the commit tag" \
                "${{ github.ref_name }} points to) ended in $state, so there" \
                "is nothing to promote. Production is unchanged." >&2
              exit 1
            fi

            if [ "$SECONDS" -ge "$deadline" ]; then
              if [ -z "$state" ]; then
                echo "::error::No production build found for commit $GITHUB_SHA" \
                  "(the commit tag ${{ github.ref_name }} points to) after 10" \
                  "minutes. Vercel only builds on pushes to main, so this commit" \
                  "must already be on main and built there before it can be" \
                  "promoted. Production is unchanged." >&2
              else
                echo "::error::Vercel's build of $GITHUB_SHA is still $state" \
                  "after 10 minutes. Re-run this job once it is READY." \
                  "Production is unchanged." >&2
              fi
              exit 1
            fi

            echo "Build of $GITHUB_SHA is ${state:-not listed yet}; checking again in 15s."
            sleep 15
          done

      - name: Promote to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel promote "https://${{ steps.find.outputs.url }}" --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID" --yes
