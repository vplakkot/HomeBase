name: Promote to production

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Check Vercel authentication
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          if ! vercel whoami --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"; then
            echo "::error::VERCEL_TOKEN could not authenticate as a user." \
              "This usually means the token is scoped too narrowly (e.g. to" \
              "a single project) rather than to the full account. Regenerate" \
              "it at vercel.com/account/tokens without a project restriction" \
              "and update the VERCEL_TOKEN secret." >&2
            exit 1
          fi

      - name: Wait for the tagged commit's build to be ready
        id: find
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          # A tag pushed right after its merge can arrive while Vercel is
          # still building that commit, and promoting an unfinished build
          # fails with a 422. Poll until the build is READY (up to 10
          # minutes), and stop early if it errored or was cancelled.
          deadline=$((SECONDS + 600))
          while true; do
            response=$(curl -s \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?projectId=${VERCEL_PROJECT_ID}&target=production&limit=100")

            api_error=$(echo "$response" | jq -r '.error.message // empty')
            if [ -n "$api_error" ]; then
              echo "::warning::Vercel API said: $api_error. Retrying."
            fi

            builds=$(echo "$response" | jq -c --arg sha "$GITHUB_SHA" \
              '[.deployments[]? | select(.meta.githubCommitSha == $sha)]')

            url=$(echo "$builds" | jq -r \
              '[.[] | select((.readyState // .state) == "READY")][0].url // empty')
            if [ -n "$url" ]; then
              echo "Found ready deployment for $GITHUB_SHA: $url"
              echo "url=$url" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            state=$(echo "$builds" | jq -r '.[0] | (.readyState // .state) // empty')
            case "$state" in
              ERROR|CANCELED)
                echo "::error::Vercel's build of $GITHUB_SHA (the commit tag" \
                  "${{ github.ref_name }} points to) ended in $state, so there" \
                  "is nothing to promote. Production is unchanged." >&2
                exit 1
                ;;
            esac

            if [ "$SECONDS" -ge "$deadline" ]; then
              if [ -z "$state" ]; then
                echo "::error::No production build found for commit $GITHUB_SHA" \
                  "(the commit tag ${{ github.ref_name }} points to) after 10" \
                  "minutes. Vercel only builds on pushes to main, so this commit" \
                  "must already be on main and built there before it can be" \
                  "promoted. Production is unchanged." >&2
              else
                echo "::error::Vercel's build of $GITHUB_SHA is still $state" \
                  "after 10 minutes. Re-run this job once it is READY." \
                  "Production is unchanged." >&2
              fi
              exit 1
            fi

            echo "Build of $GITHUB_SHA is ${state:-not listed yet}; checking again in 15s."
            sleep 15
          done

      - name: Promote to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel promote "https://${{ steps.find.outputs.url }}" --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID" --yes
