name: Promote to production

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Check Vercel authentication
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          if ! vercel whoami --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"; then
            echo "::error::VERCEL_TOKEN could not authenticate as a user." \
              "This usually means the token is scoped too narrowly (e.g. to" \
              "a single project) rather than to the full account. Regenerate" \
              "it at vercel.com/account/tokens without a project restriction" \
              "and update the VERCEL_TOKEN secret." >&2
            exit 1
          fi

      - name: Find deployment for the tagged commit
        id: find
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          response=$(curl -s \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=${VERCEL_PROJECT_ID}&target=production&limit=100")

          url=$(echo "$response" | jq -r --arg sha "$GITHUB_SHA" \
            '[.deployments[] | select(.meta.githubCommitSha == $sha)][0].url // empty')

          if [ -z "$url" ]; then
            echo "::error::No production build found for commit $GITHUB_SHA" \
              "(the commit tag ${{ github.ref_name }} points to). Vercel only" \
              "builds on pushes to main, so this commit must already be on" \
              "main and built there before it can be promoted. Production is" \
              "unchanged." >&2
            exit 1
          fi

          echo "Found deployment for $GITHUB_SHA: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Promote to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel promote "https://${{ steps.find.outputs.url }}" --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID" --yes
