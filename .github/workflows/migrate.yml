name: Apply migrations

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"

concurrency:
  group: apply-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the Supabase secrets are configured
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD must both be" \
              "set as repository secrets. Create the token at" \
              "supabase.com/dashboard/account/tokens; the database password is" \
              "under the project's Database settings." >&2
            exit 1
          fi

      - name: Apply pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          npx supabase link --project-ref zyspyqvbsvbqbjgdzjpc --password "$SUPABASE_DB_PASSWORD" --yes
          npx supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --yes
          npx supabase migration list --linked
